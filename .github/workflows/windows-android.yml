name: Windows and Android verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Run integration and H.264 capture checks
        shell: pwsh
        run: dotnet run --project tests/IntegrationChecks -- --capture

      - name: Build Windows portable and Android APK
        shell: pwsh
        run: |
          $androidSdkPath = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdkPath)) { $androidSdkPath = $env:ANDROID_HOME }
          if ([string]::IsNullOrWhiteSpace($androidSdkPath)) { $androidSdkPath = Join-Path $env:USERPROFILE '.android\sdk' }
          if (!(Test-Path -LiteralPath (Join-Path $androidSdkPath 'platforms\android-35\android.jar'))) {
            throw "Android 35 SDK was not found at $androidSdkPath"
          }
          if ([string]::IsNullOrWhiteSpace($env:JAVA_HOME)) { throw 'JAVA_HOME was not set by setup-java' }
          ./build.ps1 -Android -AndroidSdk $androidSdkPath -AndroidJdk $env:JAVA_HOME

      - name: Test release APK signing with a temporary key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $androidSdkPath = $env:ANDROID_SDK_ROOT
          if ([string]::IsNullOrWhiteSpace($androidSdkPath)) { $androidSdkPath = $env:ANDROID_HOME }
          if ([string]::IsNullOrWhiteSpace($androidSdkPath)) { throw 'Android SDK path was not set.' }
          if ([string]::IsNullOrWhiteSpace($env:JAVA_HOME)) { throw 'JAVA_HOME was not set by setup-java' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'prd-release-signing-test.jks'
          $releaseApk = Join-Path $PWD 'android/build/RemoteDesktop-release.apk'
          $password = [guid]::NewGuid().ToString('N') + '!A9'
          try {
            & (Join-Path $env:JAVA_HOME 'bin/keytool.exe') -genkeypair -noprompt -alias 'prd-ci-release-test' -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=PRD CI Release Test' -keystore $keyPath -storepass $password -keypass $password
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the temporary signing key.' }
            $env:ANDROID_RELEASE_KEYSTORE = $keyPath
            $env:ANDROID_RELEASE_KEY_ALIAS = 'prd-ci-release-test'
            $env:ANDROID_RELEASE_STORE_PASSWORD = $password
            $env:ANDROID_RELEASE_KEY_PASSWORD = $password
            & ./android/build.ps1 -Sdk $androidSdkPath -Jdk $env:JAVA_HOME -Release -ReleaseKeystore $keyPath -ReleaseAlias 'prd-ci-release-test' -ReleaseStorePassword $password -ReleaseKeyPassword $password
            if ($LASTEXITCODE -ne 0) { throw 'The release signing build failed.' }
            if (!(Test-Path -LiteralPath $releaseApk -PathType Leaf)) { throw 'The release APK was not produced.' }
          }
          finally {
            $env:ANDROID_RELEASE_KEYSTORE = $null
            $env:ANDROID_RELEASE_KEY_ALIAS = $null
            $env:ANDROID_RELEASE_STORE_PASSWORD = $null
            $env:ANDROID_RELEASE_KEY_PASSWORD = $null
            if (Test-Path -LiteralPath $releaseApk) { Remove-Item -LiteralPath $releaseApk -Force }
            if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath -Force }
          }

      - name: Smoke-test responsive WPF layout
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/RemoteDesktop/RemoteDesktop.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $executable = Join-Path "artifacts/$version/windows-portable" 'RemoteDesktop.exe'
          if (!(Test-Path -LiteralPath $executable)) { throw "Windows executable was not found: $executable" }
          $stdout = Join-Path $env:RUNNER_TEMP 'wpf-ui-smoke.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'wpf-ui-smoke.stderr.log'
          $smoke = Start-Process -FilePath $executable -ArgumentList '--ui-smoke' -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($smoke.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout }
            if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr }
            throw "Responsive WPF smoke test failed with exit code $($smoke.ExitCode)"
          }
          Write-Output 'Responsive WPF layout smoke passed.'

      - name: Smoke-test Windows machine service install and removal
        shell: pwsh
        timeout-minutes: 6
        run: |
          [xml]$project = Get-Content src/RemoteDesktop/RemoteDesktop.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          $executable = Join-Path "artifacts/$version/windows-portable" 'RemoteDesktop.exe'
          if (!(Test-Path -LiteralPath $executable -PathType Leaf)) { throw "Windows executable was not found: $executable" }
          ./tests/WindowsMachineInstallSmoke.ps1 -ExecutablePath $executable

      - name: Upload Windows machine install smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-machine-install-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/windows-machine-install-smoke.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Windows SignTool timeout cleanup
        shell: pwsh
        timeout-minutes: 1
        run: ./tests/WindowsSignToolTimeoutSmoke.ps1

      - name: Create and export temporary Windows signing certificate
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'prd-windows-signing-test.pfx'
          $certificatePath = Join-Path $env:RUNNER_TEMP 'prd-windows-signing-test.cer'
          $thumbprintPath = Join-Path $env:RUNNER_TEMP 'prd-windows-signing-test.thumbprint'
          $subject = 'CN=PRD CI Code Signing Test'
          if (Get-ChildItem Cert:\CurrentUser\My | Where-Object Subject -eq $subject) { throw 'The temporary code-signing subject already exists on this runner.' }
          $password = [guid]::NewGuid().ToString('N') + '!A9'
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $certificate = $null
          try {
            $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject $subject -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy Exportable -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -NotAfter (Get-Date).AddDays(3)
            $thumbprint = $certificate.Thumbprint
            Set-Content -LiteralPath $thumbprintPath -Value $thumbprint -NoNewline
            Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $securePassword | Out-Null
            Export-Certificate -Cert $certificate -FilePath $certificatePath | Out-Null
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "WINDOWS_SIGNING_TEST_THUMBPRINT=$thumbprint"
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "WINDOWS_SIGNING_PFX=$pfxPath"
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "WINDOWS_SIGNING_PFX_PASSWORD=$password"
            Add-Content -LiteralPath $env:GITHUB_ENV -Value 'WINDOWS_SIGNING_TIMESTAMP_URL='
            Write-Output 'Temporary code-signing certificate prepared.'
          }
          finally {
            if ($certificate) { $certificate.Dispose() }
            if ($securePassword) { $securePassword.Dispose() }
          }

      - name: Trust temporary code-signing certificate
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $thumbprint = $env:WINDOWS_SIGNING_TEST_THUMBPRINT
          $certificatePath = Join-Path $env:RUNNER_TEMP 'prd-windows-signing-test.cer'
          if ([string]::IsNullOrWhiteSpace($thumbprint) -or !(Test-Path -LiteralPath $certificatePath -PathType Leaf)) { throw 'The temporary certificate files were not prepared.' }
          Write-Output 'Importing the temporary certificate into CurrentUser\Root without an interactive prompt.'
          Import-Certificate -FilePath $certificatePath -CertStoreLocation 'Cert:\CurrentUser\Root' -Confirm:$false | Out-Null
          Write-Output 'Temporary code-signing certificate trusted for the CI verification.'

      - name: Remove temporary private key to exercise PFX import
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $thumbprint = $env:WINDOWS_SIGNING_TEST_THUMBPRINT
          if ([string]::IsNullOrWhiteSpace($thumbprint)) { throw 'The temporary certificate thumbprint was not prepared.' }
          $certificate = Get-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -ErrorAction Stop
          if (!$certificate.HasPrivateKey) { throw 'The temporary certificate has no private key before PFX import.' }
          $certificate.Dispose()
          Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -DeleteKey -Force -Confirm:$false
          Write-Output 'Temporary certificate removed from CurrentUser\My; the build must import its PFX.'

      - name: Sign and verify a Windows executable with the temporary certificate
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          $pfxPath = $env:WINDOWS_SIGNING_PFX
          $outputRoot = Join-Path $env:RUNNER_TEMP 'prd-windows-signing-output'
          if ([string]::IsNullOrWhiteSpace($pfxPath) -or !(Test-Path -LiteralPath $pfxPath -PathType Leaf)) { throw 'The temporary signing PFX was not prepared.' }
          ./build.ps1 -WindowsSign -WindowsNoTimestamp -WindowsSigningPfx $pfxPath -WindowsSignToolTimeoutSeconds 60 -OutputRoot $outputRoot
          $signedExe = Join-Path $outputRoot 'windows-portable/RemoteDesktop.exe'
          if (!(Test-Path -LiteralPath $signedExe -PathType Leaf)) { throw 'The signed portable executable was not produced.' }
          Write-Output 'Temporary Authenticode signing and verification passed.'

      - name: Clean up temporary Windows signing material
        if: always()
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Continue'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'prd-windows-signing-test.pfx'
          $certificatePath = Join-Path $env:RUNNER_TEMP 'prd-windows-signing-test.cer'
          $thumbprintPath = Join-Path $env:RUNNER_TEMP 'prd-windows-signing-test.thumbprint'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'prd-windows-signing-output'
          $thumbprint = if (Test-Path -LiteralPath $thumbprintPath) { (Get-Content -LiteralPath $thumbprintPath -Raw).Trim() } else { $env:WINDOWS_SIGNING_TEST_THUMBPRINT }
          if ($thumbprint -and (Test-Path -LiteralPath "Cert:\CurrentUser\My\$thumbprint")) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -DeleteKey -Force -Confirm:$false }
          if ($thumbprint -and (Test-Path -LiteralPath "Cert:\CurrentUser\Root\$thumbprint")) { Remove-Item -LiteralPath "Cert:\CurrentUser\Root\$thumbprint" -Force -Confirm:$false }
          if ($certificatePath -and (Test-Path -LiteralPath $certificatePath)) { Remove-Item -LiteralPath $certificatePath -Force }
          if ($pfxPath -and (Test-Path -LiteralPath $pfxPath)) { Remove-Item -LiteralPath $pfxPath -Force }
          if (Test-Path -LiteralPath $thumbprintPath) { Remove-Item -LiteralPath $thumbprintPath -Force }
          if (Test-Path -LiteralPath $outputRoot) {
            $runnerRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
            if (!$runnerRoot.EndsWith([System.IO.Path]::DirectorySeparatorChar)) { $runnerRoot += [System.IO.Path]::DirectorySeparatorChar }
            $resolvedOutput = [System.IO.Path]::GetFullPath($outputRoot)
            if ($resolvedOutput.StartsWith($runnerRoot, [System.StringComparison]::OrdinalIgnoreCase)) { Remove-Item -LiteralPath $resolvedOutput -Recurse -Force }
            else { Write-Warning 'Signing test output escaped RUNNER_TEMP; retaining it for inspection.' }
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'WINDOWS_SIGNING_PFX='
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'WINDOWS_SIGNING_PFX_PASSWORD='
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'WINDOWS_SIGNING_TIMESTAMP_URL='
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'WINDOWS_SIGNING_TEST_THUMBPRINT='

      - name: Upload Windows and Android build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: remote-desktop-${{ github.sha }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14
